# AGK Radar on Cloudflare: site + API + hourly/fast passes (Cron Triggers -> Workflows), D1, R2, Workers AI.
name = "agk-radar"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = true
preview_urls = false

[limits]
cpu_ms = 300000
# one pass runs in one Workflow instance: a full pass makes well over the default 10,000 subrequests (timelines, video
# segments, AGK Intelligence calls), so the cap is raised; it stays a guard against a runaway loop
subrequests = 200000

[vars]
SITE_URL = "https://agk-radar.x-18a.workers.dev"   # switches to https://radar.agentik-os.com after the zone move
INDEXABLE = "false"                                 # "true" once served on the public hostname
WHISPER_MODEL = "@cf/openai/whisper-large-v3-turbo"

[assets]
directory = "../site"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "agk-radar"
database_id = "232c91e1-fb1a-4a85-87f9-5bda3022129e"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "agk-radar"

[ai]
binding = "AI"

[[workflows]]
name = "agk-radar-pass"
binding = "RADAR_PASS"
class_name = "RadarPass"

[triggers]
crons = ["7 * * * *", "2-59/10 * * * *"]  # full pass hourly at :07; fast pass every 10 minutes (:02, :12, ...), alongside a running full pass

[observability]
enabled = true
