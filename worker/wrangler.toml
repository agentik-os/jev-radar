# AGK Radar on Cloudflare: site + API + hourly/fast passes (Cron Triggers -> Workflows), D1, R2, Workers AI.
name = "agk-radar"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = true     # the workers.dev copy stays up as a preview and sends noindex (site.ts indexable())
preview_urls = false

# public hostname and the old one (Workers custom domains: Cloudflare owns their DNS records and certificates). index.ts
# answers jev.agentik-os.com with a 301 to the same path on radar.agentik-os.com. Keep both here: a deploy without a
# route can detach that domain.
routes = [
  { pattern = "radar.agentik-os.com", custom_domain = true },
  { pattern = "jev.agentik-os.com", custom_domain = true },
]

[limits]
cpu_ms = 300000
# one pass runs in one Workflow instance: a full pass makes well over the default 10,000 subrequests (timelines, video
# segments, AGK Intelligence calls), so the cap is raised; it stays a guard against a runaway loop
subrequests = 200000

[vars]
SITE_URL = "https://radar.agentik-os.com"           # canonical origin (public hostname since 2026-10-19)
INDEXABLE = "true"                                  # indexing open on radar.agentik-os.com; *.workers.dev stays noindex
WHISPER_MODEL = "@cf/openai/whisper-large-v3-turbo"

[assets]
directory = "../site"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "agk-radar"
database_id = "232c91e1-fb1a-4a85-87f9-5bda3022129e"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "agk-radar"

[ai]
binding = "AI"

[[workflows]]
name = "agk-radar-pass"
binding = "RADAR_PASS"
class_name = "RadarPass"

[triggers]
crons = ["7 * * * *", "2-59/10 * * * *"]  # full pass hourly at :07; fast pass every 10 minutes (:02, :12, ...), alongside a running full pass

[observability]
enabled = true
