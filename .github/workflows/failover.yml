# Legacy fallback for the Vercel-hosted site (jev.agentik-os.com): a full Python pass, published to Vercel Blob,
# only when the live data is older than 70 minutes. AGK Radar itself runs on Cloudflare (worker/, Cron Triggers +
# Workflows). Disable this workflow once radar.agentik-os.com serves from Cloudflare and jev.agentik-os.com redirects.
name: Fallback (legacy Vercel site)

on:
  schedule:
    - cron: "37 * * * *"      # hourly
  workflow_dispatch:           # "Run workflow" forces a pass
    inputs:
      force:
        description: "Run even if the live data is fresh"
        type: boolean
        default: false

concurrency:
  group: jev-radar-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - name: Is the live data fresh?
        id: check
        run: |
          age=$(curl -s "https://jev.agentik-os.com/data/meta.json?t=$(date +%s)" \
            | python3 -c 'import json,sys,time; print(int(time.time()-json.load(sys.stdin)["updated"]))' 2>/dev/null || echo 999999)
          echo "Live data age: $((age/60)) min"
          if [ "${{ inputs.force }}" != "true" ] && [ "$age" -lt 4200 ]; then
            echo "run=false" >> $GITHUB_OUTPUT
            echo "Live data is fresh (under 70 min): nothing to do." >> $GITHUB_STEP_SUMMARY
          else
            echo "run=true" >> $GITHUB_OUTPUT
            echo "Live data is $((age/60)) min old: running a full pass." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Tools (ffmpeg for transcripts)
        if: steps.check.outputs.run == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - uses: astral-sh/setup-uv@v5
        if: steps.check.outputs.run == 'true'
        with: { enable-cache: true }

      - name: Full pass
        if: steps.check.outputs.run == 'true'
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        working-directory: pipeline
        run: |
          set -e
          uv run --project .. python replies.py || true
          uv run --project .. --extra ci python crawl.py
          uv run --project .. --extra ci python transcribe.py || true
          uv run --project .. python analyze.py
          uv run --project .. python ideas_eval.py
          uv run --project .. python build.py
          uv run --project .. python publish.py

      - name: Save data
        if: steps.check.outputs.run == 'true'
        run: |
          git config user.name "AGK Radar bot (GitHub)"
          git config user.email "bot@agentik-os.com"
          git add -A data site api
          git diff --cached --quiet || git commit -q -m "data: GitHub fallback $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git push -q && break
            git pull --rebase --quiet -X theirs || git rebase --abort || true
          done
          echo "Site republished from GitHub." >> $GITHUB_STEP_SUMMARY
