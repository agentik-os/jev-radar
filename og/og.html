<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Instrument+Serif:ital@1&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;overflow:hidden;background:#09090b;color:#f4f4f5;font-family:Inter,sans-serif;position:relative}
.glow{position:absolute;inset:0;background:radial-gradient(700px 420px at 88% 8%,rgba(197,248,42,.20),transparent 70%),radial-gradient(520px 360px at 0% 100%,rgba(88,101,242,.28),transparent 70%)}
.rings{position:absolute;right:-140px;top:-140px;width:620px;height:620px}
.rings i{position:absolute;inset:0;border:2px solid rgba(197,248,42,.16);border-radius:50%}
.rings i:nth-child(2){inset:90px;border-color:rgba(197,248,42,.24)}
.rings i:nth-child(3){inset:180px;border-color:rgba(197,248,42,.34)}
.rings b{position:absolute;inset:280px;background:#c5f82a;border-radius:50%;box-shadow:0 0 60px #c5f82a}
.wrap{position:relative;padding:62px 72px;height:100%;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:14px;font-size:30px;font-weight:600}
.brand em{font-family:"Instrument Serif";font-weight:400;color:#c5f82a;font-size:38px}
.dot{width:18px;height:18px;border-radius:50%;background:#c5f82a;box-shadow:0 0 18px #c5f82a}
.live{margin-left:18px;font:500 17px "JetBrains Mono";color:#8a8a94;border:1px solid #2e2e36;border-radius:99px;padding:6px 14px}
h1{font-size:82px;line-height:1.02;letter-spacing:-.04em;font-weight:700;margin-top:52px;max-width:900px}
h1 em{font-family:"Instrument Serif";font-weight:400;color:#c5f82a;letter-spacing:-.01em}
p{font-size:27px;color:#c9c9cf;margin-top:22px;max-width:880px;line-height:1.35}
.row{margin-top:auto;display:flex;gap:12px;align-items:center}
.pill{font:500 19px "JetBrains Mono";border:1px solid #2e2e36;background:#131316;border-radius:12px;padding:10px 16px;color:#f4f4f5}
.pill b{color:#c5f82a}
.url{margin-left:auto;font:600 22px Inter;color:#c5f82a}
</style></head><body><div class="glow"></div><div class="rings"><i></i><i></i><i></i><b></b></div>
<div class="wrap">
 <div class="brand"><span class="dot"></span>Jev <em>Radar</em><span class="live">● LIVE · updated hourly</span></div>
 <h1 id="h">Everything happening with <em>Jev</em>. And where the money is.</h1>
 <p id="p">Every post, demo and debate about TypeSafe's Jev on X, classified by Jev itself.</p>
 <div class="row" id="r"><span class="pill"><b>3,000+</b> posts</span><span class="pill"><b>22</b> niches ranked</span><span class="pill"><b>50</b> business ideas</span><span class="url">jev.agentik-os.com</span></div>
 <script>
 // variantes : og.html?h=...&p=...&pills=a|b|c&u=chemin
 const q = new URLSearchParams(location.search);
 if (q.get("h")) document.getElementById("h").innerHTML = q.get("h");
 if (q.get("p")) document.getElementById("p").textContent = q.get("p");
 if (q.get("pills")) document.getElementById("r").innerHTML = q.get("pills").split("|").map(x => `<span class="pill">${x}</span>`).join("") + `<span class="url">jev.agentik-os.com${q.get("u") || ""}</span>`;
 </script>
</div></body></html>
