<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@500;600;700&family=Fragment+Mono&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;overflow:hidden;background:#fefefe;color:#1e1e1e;font-family:"Host Grotesk",sans-serif;position:relative}
.glow{position:absolute;inset:0;background:radial-gradient(420px 300px at 0% 0%,rgba(243,134,161,.85),transparent 70%),radial-gradient(460px 320px at 100% 0%,rgba(212,91,182,.75),transparent 70%),radial-gradient(380px 260px at 100% 100%,rgba(243,134,161,.45),transparent 70%),linear-gradient(#e4f1fb,#fefefe 70%)}
.rings{display:none}
.wrap{position:relative;padding:58px 72px;height:100%;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:14px;font-size:30px;font-weight:600;letter-spacing:-.02em}
.brand em{font-style:normal;color:#d45bb6}
.dot{width:18px;height:18px;border-radius:50%;background:#d45bb6;box-shadow:0 0 14px #f386a1}
.live{margin-left:18px;font:16px "Fragment Mono";color:#fefefe;background:#1e1e1e;padding:6px 12px}
h1{font-size:84px;line-height:.98;letter-spacing:-.05em;font-weight:600;margin-top:48px;max-width:980px}
h1 em{font-style:normal;color:#d45bb6}
p{font-size:27px;color:#3b3b3b;margin-top:22px;max-width:900px;line-height:1.3;letter-spacing:-.01em}
.row{margin-top:auto;display:flex;gap:12px;align-items:center}
.pill{font:19px "Fragment Mono";border:1px solid #1e1e1e;background:#fff;padding:9px 14px;box-shadow:3px 3px 0 rgba(30,30,30,.15)}
.pill b{color:#d45bb6;font-weight:400}
.url{margin-left:auto;font:600 22px "Host Grotesk";color:#1e1e1e;background:#fefefe;border-bottom:3px solid #d45bb6}
</style></head><body><div class="glow"></div><div class="rings"><i></i><i></i><i></i><b></b></div>
<div class="wrap">
 <div class="brand"><span class="dot"></span>Jev <em>Radar</em><span class="live">● LIVE · updated hourly</span></div>
 <h1 id="h">Everything happening with <em>Jev</em>. And where the money is.</h1>
 <p id="p">Every post, demo and debate about TypeSafe's Jev on X, classified by Jev itself.</p>
 <div class="row" id="r"><span class="pill"><b>3,000+</b> posts</span><span class="pill"><b>22</b> niches ranked</span><span class="pill"><b>50</b> business ideas</span><span class="url">jev.agentik-os.com</span></div>
 <script>
 // variantes : og.html?h=...&p=...&pills=a|b|c&u=chemin
 const q = new URLSearchParams(location.search);
 if (q.get("h")) document.getElementById("h").innerHTML = q.get("h");
 if (q.get("p")) document.getElementById("p").textContent = q.get("p");
 if (q.get("pills")) document.getElementById("r").innerHTML = q.get("pills").split("|").map(x => `<span class="pill">${x}</span>`).join("") + `<span class="url">jev.agentik-os.com${q.get("u") || ""}</span>`;
 </script>
</div></body></html>
